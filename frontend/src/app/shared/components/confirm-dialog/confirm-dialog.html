<dialog
  #dialog
  class="ops-dialog"
  [attr.aria-labelledby]="uid + '-title'"
  [attr.aria-describedby]="uid + '-message'"
  (close)="closed.emit()"
>
  <div class="flex flex-col gap-3 p-5 sm:p-6">
    <h2 [id]="uid + '-title'" class="text-headline-lg text-on-surface">{{ title() }}</h2>
    <p [id]="uid + '-message'" class="text-body-md text-on-surface-variant">{{ message() }}</p>
    <ng-content />
    <div class="mt-2 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button type="button" class="ops-btn-secondary" [disabled]="busy()" (click)="close()">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button" class="ops-btn-primary h-10" [disabled]="busy() || confirmDisabled()" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</dialog>
