<div class="relative flex items-center">
  <span class="ms pointer-events-none absolute left-3 text-[18px] text-on-surface-variant" aria-hidden="true">{{ icon() }}</span>
  <input [id]="inputId()" [type]="visible() ? 'text' : 'password'" [formControl]="control()" [attr.autocomplete]="autocomplete()"
    [placeholder]="placeholder()" [attr.aria-invalid]="invalid() ? 'true' : null" [attr.aria-describedby]="describedBy()"
    autocapitalize="off" spellcheck="false" class="ops-input pl-9 pr-11 font-mono text-mono-data" />
  <button type="button" (click)="visible.set(!visible())" [attr.aria-pressed]="visible()" [attr.aria-controls]="inputId()"
    [attr.aria-label]="(visible() ? 'authFlow.hidePassword' : 'authFlow.showPassword') | translate"
    class="absolute right-1.5 grid size-8 place-items-center rounded-sm text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface focus-visible:outline-2 focus-visible:outline-primary-container">
    <span class="ms text-[18px]" aria-hidden="true">{{ visible() ? 'visibility_off' : 'visibility' }}</span>
  </button>
</div>
