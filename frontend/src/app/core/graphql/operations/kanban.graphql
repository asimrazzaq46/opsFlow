fragment BoardTicket on TicketSummaryDto {
  id
  displayNumber
  title
  priority
  status
  assignedToMe
  categoryName
  customerName
  updatedAtUtc
  version
  assigneeCount
  resolutionDueAtUtc
  isOverdue
  assignees { membershipId userId displayName isAgentActive }
}

query KanbanBoard($filter: KanbanFilterInput, $perColumn: Int) {
  kanbanBoard(filter: $filter, perColumn: $perColumn) {
    status
    total
    tickets { ...BoardTicket }
  }
}

# Internal child-task progress for the visible board cards (staff only; one request per board load)
query TicketTaskProgress($ticketIds: [UUID!]!) {
  ticketTaskProgress(ticketIds: $ticketIds) {
    ticketId
    totalTasks
    completedTasks
  }
}
