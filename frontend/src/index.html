<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>OpsFlow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <!-- Icon font subset: add a name here (alphabetical) when a template starts using a new Material Symbol. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&icon_names=add,add_business,add_circle,alternate_email,apartment,arrow_back,arrow_downward,arrow_forward,arrow_outward,arrow_upward,assignment_ind,attachment,badge,block,category,chat,check,check_circle,checklist,chevron_left,chevron_right,close,cloud_done,cloud_off,computer,confirmation_number,corporate_fare,dark_mode,dashboard,devices,difference,dns,domain,domain_disabled,edit,edit_note,error,group,group_add,history,hub,info,key,lan,light_mode,link,link_off,lock,lock_clock,lock_reset,login,logout,mail,manage_accounts,mark_email_read,mark_email_unread,memory,menu,notification_important,outgoing_mail,password,pause_circle,person,person_add,person_off,play_circle,policy,priority_high,progress_activity,query_stats,radio_button_unchecked,refresh,save,search,send,shield,shield_person,smartphone,star,switch_account,sync,sync_problem,task_alt,terminal,timeline,timer,timer_off,unfold_more,verified,verified_user,view_kanban,visibility,visibility_off,vpn_key,warning&display=block">
  <script>try{var t=localStorage.getItem("opsflow.theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch{}</script>
  <!-- Boot screen shown until the stored session is validated and Angular replaces the content of <app-root>. -->
  <style>
    .boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:Inter,system-ui,sans-serif;background:#faf8ff;color:#434655}
    [data-theme="dark"] .boot{background:#0b1020;color:#a3b1c6}
    .boot img{height:56px;width:auto;border-radius:10px}
    .boot-spinner{width:28px;height:28px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;opacity:.7;animation:boot-spin .8s linear infinite}
    .boot p{margin:0;font-size:14px}
    @keyframes boot-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.boot-spinner{animation-duration:2.4s}}
  </style>
</head>
<body>
  <app-root>
    <div class="boot" role="status" aria-live="polite">
      <img src="assets/brand/opsflow-logo-480.png" alt="OpsFlow" width="480" height="137">
      <span class="boot-spinner" aria-hidden="true"></span>
      <p id="boot-text">Loading your workspace…</p>
    </div>
    <script>try{if(localStorage.getItem("opsflow.lang")==="it")document.getElementById("boot-text").textContent="Caricamento dello spazio di lavoro…"}catch{}</script>
  </app-root>
</body>
</html>
